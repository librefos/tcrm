x-relaticle-env: &relaticle-env
  TZ: ${TZ}
  APP_LOCALE: ${DEFAULT_LOCALE}
  APP_NAME: ${APP_NAME:-Relaticle}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${RELATICLE_APP_KEY:?RELATICLE_APP_KEY required}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_URL: http://crm.${DOMAIN:-localhost}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${RELATICLE_DB:-relaticle_db}
  DB_USERNAME: ${RELATICLE_USER:-relaticle_app}
  DB_PASSWORD: ${RELATICLE_PASSWORD:?RELATICLE_PASSWORD required}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PORTS: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

x-chatwoot-env: &chatwoot-env
  TZ: ${TZ}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE}
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY:?CHATWOOT_SECRET_KEY required}
  FRONTEND_URL: http://chat.${DOMAIN:-localhost}
  INSTALLATION_ENV: docker
  RAILS_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_DATABASE: ${CHATWOOT_DB:-chatwoot_db}
  POSTGRES_USERNAME: ${CHATWOOT_USER:-chatwoot_app}
  POSTGRES_PASSWORD: ${CHATWOOT_PASSWORD:?CHATWOOT_PASSWORD required}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1

volumes:
  postgres:
  redis:
  relaticle_storage:
  chatwoot_storage:
  evolution_instances:
  n8n_storage:

networks:
  tcrm_network:
    driver: bridge

services:
  traefik:
    image: traefik:v3.7
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - tcrm_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${DASHBOARD_USERS}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      - TZ=${TZ}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - RELATICLE_DB=${RELATICLE_DB:-relaticle_db}
      - RELATICLE_USER=${RELATICLE_USER:-relaticle_app}
      - RELATICLE_PASSWORD=${RELATICLE_PASSWORD:?RELATICLE_PASSWORD required}
      - CHATWOOT_DB=${CHATWOOT_DB:-chatwoot_db}
      - CHATWOOT_USER=${CHATWOOT_USER:-chatwoot_app}
      - CHATWOOT_PASSWORD=${CHATWOOT_PASSWORD:?CHATWOOT_PASSWORD required}
      - N8N_DB=${N8N_DB:-n8n_db}
      - N8N_USER=${N8N_USER:-n8n_app}
      - N8N_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD required}
      - EVOLUTION_DB=${EVOLUTION_DB:-evolution_db}
      - EVOLUTION_USER=${EVOLUTION_USER:-evolution_app}
      - EVOLUTION_PASSWORD=${EVOLUTION_PASSWORD:?EVOLUTION_PASSWORD required}
    restart: unless-stopped
    networks:
      - tcrm_network
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s

  redis:
    image: redis:8.4-alpine
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - tcrm_network
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  relaticle:
    image: ghcr.io/relaticle/relaticle:latest
    restart: unless-stopped
    networks:
      - tcrm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *relaticle-env
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: "true"
    volumes:
      - relaticle_storage:/var/www/html/storage/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.relaticle.rule=Host(`crm.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.relaticle.entrypoints=web"
      - "traefik.http.services.relaticle.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  relaticle-horizon:
    image: ghcr.io/relaticle/relaticle:latest
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    networks:
      - tcrm_network
    depends_on:
      relaticle:
        condition: service_healthy
    environment:
      <<: *relaticle-env
      AUTORUN_ENABLED: "false"
    volumes:
      - relaticle_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s

  relaticle-scheduler:
    image: ghcr.io/relaticle/relaticle:latest
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    networks:
      - tcrm_network
    depends_on:
      relaticle:
        condition: service_healthy
    environment:
      <<: *relaticle-env
      AUTORUN_ENABLED: "false"
    volumes:
      - relaticle_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  chatwoot:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    networks:
      - tcrm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    volumes:
      - chatwoot_storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`chat.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.chatwoot.entrypoints=web"
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    networks:
      - tcrm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *chatwoot-env
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - chatwoot_storage:/app/storage

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    networks:
      - tcrm_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - SERVER_URL=http://evolution.${DOMAIN:-localhost}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?EVOLUTION_API_KEY required}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_USER:-evolution_app}:${EVOLUTION_PASSWORD}@postgres:5432/${EVOLUTION_DB:-evolution_db}?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBSOCKET_ENABLED=true
      - CHATWOOT_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`evolution.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.evolution.entrypoints=web"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    networks:
      - tcrm_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n.${DOMAIN:-localhost}
      - N8N_DEFAULT_LOCALE=${DEFAULT_LOCALE}
      - N8N_HOST=n8n.${DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY required}
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n_db}
      - DB_POSTGRESDB_USER=${N8N_USER:-n8n_app}
      - DB_POSTGRESDB_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD required}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_storage:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
